<!doctype html><html lang="pt"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#f8f5f0;color:#493e3b;font:16px/1.5 system-ui,sans-serif}main{max-width:680px;margin:8vh auto;padding:24px}h1,strong{font-family:Georgia,serif}h1{font-size:2.4rem;margin:.3em 0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}article{background:#fffdfa;padding:22px;border:1px solid #ded7d0;border-radius:18px}strong{display:block;font-size:3rem}button{background:#765955;color:white;border:0;border-radius:12px;padding:12px 20px;font:inherit}p{color:#695b55}
</style></head><body><main><small>Sully · Administração</small><h1>Visão geral</h1>
<div class="cards"><article>Contas criadas<strong id="total">—</strong></article><article>Novas em 7 dias<strong id="recent">—</strong></article><article>Ativas nos últimos 5 min<strong id="active">—</strong></article></div>
<p>Uma conta conta uma vez, mesmo com a Sully aberta em dois dispositivos. A atividade é estimada enquanto a página está visível e ligada à internet.</p>
<button id="refresh">Atualizar</button><p id="feedback" role="status"></p></main>
<script>
const byId=id=>document.getElementById(id);
function refresh(){
  byId('refresh').disabled=true;
  byId('feedback').textContent='A consultar…';
  google.script.run.withSuccessHandler(data=>{
    byId('total').textContent=data.accounts;
    byId('active').textContent=data.active;
    byId('recent').textContent=data.recent;
    byId('feedback').textContent='Atualizado às '+new Date(data.updated).toLocaleTimeString('pt-PT');
    byId('refresh').disabled=false;
  }).withFailureHandler(()=>{
    byId('recent').textContent=byId('total').textContent=byId('active').textContent='—';
    byId('feedback').textContent='Não foi possível consultar os dados. Verifica o acesso da conta ao projeto Sully.';
    byId('refresh').disabled=false;
  }).getMetrics();
}
byId('refresh').onclick=refresh;refresh();
</script></body></html>
